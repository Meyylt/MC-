<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un service</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/ajouter-service.css">
    <link rel="stylesheet" href="../css/profil-pop-up.css">
    <link rel="stylesheet" href="../css/notif.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="vitrine-freelancer.html"><span>SkillNet</span><span class="dot">●</span></a></div>
        <div class="icons">
            <img src="../images/mail 1.png" alt="Message" class="icon">
            
            <img src="../images/user 1 (1).png" alt="Profil" class="icon profile-icon profil-pop-up">
            <img src="../images/user 1 (1).png" alt="Profil" class="icon profile-icon">
        </div>
    </header>

    <main>
        <h4>Ajoutez les informations correspondantes à votre service !</h4>
        <form id="serviceForm">
            <input type="text" id="titre" name="titre" placeholder="Titre" required>
            <select id="categorie" name="categorie">
                <option>Musique & Audio</option>
                <option>Graphisme & Design</option>
                <option>Développement Web</option>
                <option>Rédaction & Traduction</option>
                <option>Vidéo & animation</option>
            </select>
            <textarea id="description" name="description" placeholder="Description" required rows="4"></textarea>
            <div class="price-delivery">
                <input type="text" id="prix" name="prix" placeholder="Prix (DA)" required>
                <input type="text" id="dureEstime" name="delais" placeholder="Délai (ex: 3 jours)" required>
            </div>
            <div class="form-group full-width">
                <label for="productImages">Images du Produit*</label>
                <div class="file-upload">
                    <input type="file" id="productImages" multiple accept="image/*">
                    <label for="productImages" class="upload-btn">
                        <i class="fas fa-cloud-upload-alt"></i> Choisir des images
                    </label>
                    <span id="file-count">0 fichier(s) sélectionné(s)</span>
                </div>
                <div id="imagePreview" class="image-preview"></div>
                <small>Format recommandé : JPEG ou PNG (max 2MB par image)</small>
            </div>
            <button type="submit" id="poster">Poster</button>
        </form>
    </main>
    <!-- Boîte de confirmation (POP-UP) -->
    <div id="confirmationPopup" class="popup-overlay">
        <div class="popup-content">
          <img id="closePopup" src="../images/fermer.png" alt="Fermer" class="close-btn" />
          <p>Votre service a été postée avec succès.</p>
          <button id="okButton">OK</button>
        </div>
      </div>
    <script src="../js/ajouterService.js"></script>
    <div class="pop-up-profil">
        <a href="profil-freelancer.html">Mon compte</a>
        <a href="profil-freelancer.html">Mon compte</a>
        <a href="ajouter-service.html">Ajouter un service</a>
        <a href="messervices.html">Mes service</a>
        <a href="demmande-free.html">Demmande</a>
        <a href="mission-free.html">Mes missions</a>
        <hr>
        <a href="vitrine-visiteur.html">se deconnecté</a>
    </div>
    
    <script src="../js/profil-pop-up.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Gestion de l'upload d'images
            const fileInput = document.getElementById('productImages');
            const fileCount = document.getElementById('file-count');
            const imagePreview = document.getElementById('imagePreview');
            
            fileInput.addEventListener('change', function(e) {
                const files = e.target.files;
                fileCount.textContent = `${files.length} fichier(s) sélectionné(s)`;
                
                imagePreview.innerHTML = '';
                
                if (files) {
                    Array.from(files).forEach(file => {
                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            
                            reader.onload = function(event) {
                                const img = document.createElement('img');
                                img.src = event.target.result;
                                imagePreview.appendChild(img);
                            }
                            
                            reader.readAsDataURL(file);
                        }
                    });
                }
            });
            
            
           
           
           
        });

        document.getElementById("serviceForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const titre = document.getElementById("titre").value.trim();
    const description = document.getElementById("description").value.trim();
    const dureEstime = document.getElementById("dureEstime").value.trim();
    const prix = document.getElementById("prix").value.trim();
    const categorie = document.getElementById("categorie").value;
    const image = document.getElementById('productImages').files[0];

    if (!titre || !description || !dureEstime || !prix) {
        alert("Veuillez remplir tous les champs obligatoires");
        return;
    }

    if (isNaN(prix) || isNaN(dureEstime)) {
        alert("Le prix et le délai doivent être des nombres valides");
        return;
    }

    const token = localStorage.getItem("authToken");
    if (!token) {
        alert("Vous devez être connecté");
        window.location.href = "connexion.html";
        return;
    }

    // 🔁 Créer un FormData pour envoi avec image
    const formData = new FormData();
    formData.append("titre", titre);
    formData.append("categorie", categorie);
    formData.append("description", description);
    formData.append("dureEstime", dureEstime);
    formData.append("prix", prix);
    if (image) {
        formData.append("image", image); // DOIT correspondre à req.file côté backend
    }

    try {
        const response = await fetch("http://localhost:3001/messervices/add", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${token}`
                // ❌ Ne pas mettre "Content-Type", le navigateur le gère avec FormData
            },
            body: formData
        });

        const result = await response.json();

        if (!response.ok) throw new Error(result.message || "Erreur ajout service");

        document.getElementById("confirmationPopup").style.display = "flex";
        document.getElementById("serviceForm").reset();

    } catch (error) {
        console.error("Erreur:", error);
        alert("Erreur: " + error.message);
    }
});


        // Fermer le popup
        document.getElementById("closePopup").addEventListener("click", () => {
            document.getElementById("confirmationPopup").style.display = "none";
        });
     </script>

    
</body>
</html>

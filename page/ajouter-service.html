<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un service</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/ajouter-service.css">
    <link rel="stylesheet" href="../css/profil-pop-up.css">
    <link rel="stylesheet" href="../css/notif.css">
</head>
<body>
    <header>
        <div class="logo">SkillNet<span class="dot">●</span></div>
        <div class="icons">
            <img src="../images/bell 1.png" alt="Notification" class="icon notif-icon">
            <img src="../images/mail 1.png" alt="Message" class="icon">
            
            <img src="../images/user 1 (1).png" alt="Profil" class="icon profile-icon profil-pop-up">
            <img src="../images/user 1 (1).png" alt="Profil" class="icon profile-icon">
        </div>
    </header>

    <main>
        <h4>Ajoutez les informations correspondantes à votre service !</h4>
        <form id="serviceForm">
            <input type="text" id="titre" name="titre" placeholder="Titre" required>
            <select id="categorie" name="categorie">
                <option>Musique & Audio</option>
                <option>Graphisme & Design</option>
                <option>Développement Web</option>
                <option>Rédaction & Traduction</option>
            </select>
            <textarea id="description" name="description" placeholder="Description" required rows="4"></textarea>
            <div class="price-delivery">
                <input type="text" id="prix" name="prix" placeholder="Prix (DA)" required>
                <input type="text" id="dureEstime" name="delais" placeholder="Délai (ex: 3 jours)" required>
            </div>
            <button type="submit" id="poster">Poster</button>
        </form>
    </main>
    <!-- Boîte de confirmation (POP-UP) -->
    <div id="confirmationPopup" class="popup-overlay">
        <div class="popup-content">
          <img id="closePopup" src="../images/fermer.png" alt="Fermer" class="close-btn" />
          <p>Votre service a été postée avec succès.</p>
          <button id="okButton">OK</button>
        </div>
      </div>
    <script src="../js/ajouterService.js"></script>
    <div class="pop-up-profil">
        <a href="profil-freelancer.html">Mon compte</a>
        <a href="ajouter-service.html">Poster un service</a>
        <a href="#">Mes service</a>
        <hr>
        <a href="connexion.html">se deconnecté</a>
    </div>
    
    <script src="../js/profil-pop-up.js"></script>
    <div class="pop-up-nitif">
        <div class="notification-container">
            <img src="../images/bell 1.png" alt="Image">
            <h2>NOTIFICATIONS</h2>
        </div>
        <div class="notifications">
           <div class="notification">
             <p>FARHI Louisa vous a envoyé une mission</p>
           </div>
        </div>
    </div>
    <script src="../js/notif-pop-up.js"></script>

    <script>
         document.getElementById("serviceForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            // Récupération des valeurs du formulaire
            const titre = document.getElementById("titre").value.trim();
            const description = document.getElementById("description").value.trim();
            const dureEstime = document.getElementById("dureEstime").value.trim();
            const prix = document.getElementById("prix").value.trim();
            const categorie = document.getElementById("categorie").value;

            if (!titre || !description || !dureEstime|| !prix) {
                alert("Veuillez remplir tous les champs obligatoires");
                return;
            }

            if (isNaN(prix) || isNaN(dureEstime)) {
                alert("Le prix et le délai doivent être des nombres valides");
                return;
            }

            // Récupération du token JWT
            const token = localStorage.getItem("authToken"); 
            if (!token) {
                alert("Vous devez être connecté pour ajouter un service");
                window.location.href = "connexion.html";
                return;
            }

            const serviceData = {
                titre,
                categorie,
                description,
                dureEstime: parseInt(dureEstime),
                prix: parseFloat(prix)
            };

            try {
                const response = await fetch("http://localhost:3001/messervices/add", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(serviceData),
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Erreur lors de la création du service");
                }

                document.getElementById("confirmationPopup").style.display = "flex";
                document.getElementById("serviceForm").reset();
                

            } catch (error) {
                console.error("Erreur :", error);
                alert(`Erreur: ${error.message}`);
            }
        });

        // Fermer le popup
        document.getElementById("closePopup").addEventListener("click", () => {
            document.getElementById("confirmationPopup").style.display = "none";
        });
     </script>

    
</body>
</html>

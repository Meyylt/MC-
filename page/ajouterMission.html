<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajouter une Mission</title>
    <link rel="stylesheet" href="../css/ajouterMission.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/notif.css">
    <link rel="stylesheet" href="../css/profil-pop-up.css">
</head>
<body>
    <header>
      <div class="logo" >
        <a href="vitrine-client.html"><span>SkillNet</span><span class="dot">●</span></a>
      </div>
      <div class="icons">
        <img src="../images/mail 1.png" alt="Message" class="icon" />
        <img src="../images/user 1 (1).png" alt="Profil" class="icon profil-pop-up" />
      </div>
    </header>
    <main>
      <div class="form-g">
      <h4>Ajoutez les informations correspondantes à votre mission !</h4>
      <form id="missionForm">
        <input type="text" id="titre" name="titre" placeholder="Titre" required />
        <select id="categorie" name="categorie">
          <option>Musique & Audio</option>
                <option>Graphisme & Design</option>
                <option>Développement Web</option>
                <option>Rédaction & Traduction</option>
                <option>Vidéo & animation</option>
        </select>
        <input type="text" id="description" name="description" placeholder="Description" required />
        <input type="text" id="prix" name="prix" placeholder="DA" required />
        <input type="text" id="delais" name="delais" placeholder="Nombres de jours" required />
        <button type="submit" id="poster">Poster</button>
      </form>
    </div>
      </main>
      
    <div class="pop-up-profil">
      <a href="profil-client.html">Mon compte</a>
       <a href="ajouterMission.html">Poster une mission</a>
        <a href="mesmissions.html">Mes mission</a>
        <a href="demande-cote-client.html">Mes Demmande</a>
        <hr>
        <a href="vitrine-visiteur.html">se deconnecté</a>
   </div>
   <script src="../js/profil-pop-up.js"></script>



    <!-- Boîte de confirmation (POP-UP) -->
    <div id="confirmationPopup" class="popup-overlay">
      <div class="popup-content">
        <img id="closePopup" src="../images/fermer.png" alt="Fermer" class="close-btn" />
        <p>Votre mission a été postée avec succès.</p>
      </div>
    </div>

    <script src="../js/ajouterMission.js"></script>
    <script>
     document.getElementById("missionForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    // Récupération des valeurs du formulaire
    const titre = document.getElementById("titre").value.trim();
    const description = document.getElementById("description").value.trim();
    const dureEstime = document.getElementById("delais").value.trim();
    const budget = document.getElementById("prix").value.trim();
    const categorie = document.getElementById("categorie").value;

    if (!titre || !description || !dureEstime || !budget) {
        alert("Veuillez remplir tous les champs obligatoires");
        return;
    }

    if (isNaN(budget) || isNaN(dureEstime)) {
        alert("Le budget et le délai doivent être des nombres valides");
        return;
    }

    // Récupération du token JWT
    const token = localStorage.getItem("authToken"); 
    if (!token) {
        alert("Vous devez être connecté pour ajouter une mission");
        window.location.href = "connexion.html";
        return;
    }

    const missionData = {
        titre,
        categorie,
        description,
        dureEstime: parseInt(dureEstime),
        budget: parseFloat(budget)
    };

    console.log("Données envoyées :", missionData);

    try {
        const response = await fetch("http://localhost:3001/missions/add", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}` 
            },
            body: JSON.stringify(missionData),
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Erreur lors de la création de la mission");
        }

        document.getElementById("confirmationPopup").style.display = "flex";
        document.getElementById("missionForm").reset();
        loadMissions();

    } catch (error) {
        console.error("Erreur :", error);
        alert(`Erreur: ${error.message}`);
    }
});

    // Fonction pour charger et afficher les missions
    async function loadMissions() {
      const container = document.getElementById("missionsContainer");
      
      try {
        container.innerHTML = "<p>Chargement des missions...</p>";
        
        const response = await fetch("http://localhost:3001/missions");
        const missions = await response.json();

        if (missions.length === 0) {
            container.innerHTML = "<p>Aucune mission disponible pour le moment</p>";
            return;
        }

        container.innerHTML = ""; // Vider le conteneur

        missions.forEach(mission => {
          const missionElement = `
            <div class="mission-card">
              <h3>${mission.titre}</h3>
              <p><strong>Catégorie:</strong> ${mission.categorie }</p>
              <p>${mission.description}</p>
              <p><strong>Budget:</strong> ${mission.budget} DA</p>
              <p><strong>Durée:</strong> ${mission.dureEstime} jours</p>
              <p><strong>Statut:</strong> ${mission.statut}</p>
            </div>
          `;
          container.insertAdjacentHTML("beforeend", missionElement);
        });
      } catch(error) {
        console.error("Erreur: ", error);
        container.innerHTML = "<p>Impossible de charger les missions. Veuillez réessayer.</p>";
      }
    }

    // Charger les missions au démarrage
    document.addEventListener("DOMContentLoaded", loadMissions);
    
    // Fermer le popup
    document.getElementById("closePopup").addEventListener("click", () => {
        document.getElementById("confirmationPopup").style.display = "none";
    });
    </script>
</body>
</html>

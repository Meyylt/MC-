    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // Récupérer le token d'authentification
                const token = localStorage.getItem("authToken");
                if (!token) {
                    window.location.href = "connexion.html";
                    return;
                }
        
                // Charger les services depuis l'API
                const response = await fetch("http://localhost:3001/services/musique", {
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });
        
                if (!response.ok) {
                    throw new Error("Erreur de chargement des services");
                }
        
                const services = await response.json();
                displayServices(services);
        
            } catch (error) {
                console.error("Erreur:", error);
                document.getElementById("missions-container").innerHTML = `
                    <div class="error-message">
                        <p>${error.message}</p>
                        <button onclick="location.reload()">Réessayer</button>
                    </div>
                `;
            }
        });
        
        function displayServices(services) {
            const container = document.getElementById("missions-container");
            container.innerHTML = "";
        
            if (services.length === 0) {
                container.innerHTML = '<p class="no-services">Aucun service disponible pour le moment</p>';
                return;
            }
        
            services.forEach(service => {
                const serviceElement = document.createElement("a");
                serviceElement.className = "mission";
                serviceElement.href = `detail-sevice.html?id=${service.id}`; // Lien vers la page de détail
                
                serviceElement.innerHTML = `
                    
                    <img class="images" src="../backend/uploads/${service.image}">
                    <div class="info-free">
                        <img class="imagefree" src="../backend/uploads/${service.imagefree}">
                        <p>@${service.nomutilisateure}</p>
                    </div>
                    <h2>${service.Titre}</h2>
                    <div class="info">
                    <h6>Prix:</h6>
                    <p>${service.prix} DA</p>
                    <p>/</p>
                    <p>${service.dureEstime} jours</p>
                </div>
                <div class="infonote">
                    <img class="vert" src="../images/vert.png">
                    <h4>4.7</h4>
                    <p>(44)</p>
                </div>
                `;
                container.appendChild(serviceElement);
            });
        }
        </script>

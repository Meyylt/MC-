<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/paiment.css">
    <link rel="stylesheet" href="../css/notif.css">
    
    <link rel="stylesheet" href="../css/profil-pop-up.css">
</head>
<body>
   
    
    <header >
        <div class="logo">
            <a href="vitrine-client.html"><span>SkillNet</span><span class="dot">●</span></a>
        </div>
        <input type="text" placeholder="Que cherchez-vous ? exemple: Développement web" >
       
        <div class="header-icons">
           <button class="icon"> <img src="../images/mail 1.png" alt="Image" ></button>
           <button class="icon profil-pop-up"> <img src="../images/user 1 (1).png" alt="Image" > </button>
        </div>
    </header>
   
    <nav>
        <a href="grapgisme-designe.html">Graphisme & Design</a>
        <a href="developpementweb.html">Développement Web</a>
        <a href="redactionettraduction.html">Rédaction & Traduction</a>
        <a href="videoetanimation.html">Vidéo & animation</a>
        <a href="musiqueetaudio.html">Musique & Audio</a>
    </nav>

    
    <main>
        <div class="container">

            <div class="info-paiment">
                <div class="methode">
                    <p id="btn-carte" class="active">Carte</p> 
                    <p id="btn-poste">Poste</p>   
                </div>
              <div id="cartee">
                <hr>
                <input id="numcarte" type="text" placeholder="Numéro de carte" class="input">
                <div style="display: flex; gap: 0.5rem;">
                    <input id="date-ex" type="date" placeholder="Date d'expiration" class="input">
                    <input id="vvs" type="text" placeholder="VVS" style="width: 120px; padding-left: 40px;" class="input">
                </div>
                <input id="nomcarte" type="text" placeholder="Nom & Prénom" class="input">
            </div>
            <div id="postee">
                <hr>
                <div style="display: flex; gap: 0.5rem;">
                    <input id="ccp" type="text" placeholder="ccp" class="input">
                    <input id="cle" type="text" placeholder="cle" style="width: 120px; padding-left: 40px;" class="input">
                </div>
                <input id="nomposte" type="text" placeholder="Nom & Prénom" class="input">
            </div>
                
            </div>
            

            <div class="informations">
                <h2>Développement d’un site vitrine</h2>
                <div class="total">
                    <span>Total</span>
                    <span>20000 DA</span>
                </div>
                <hr>
                <h3>Livraison dans 7 jours</h3>
                <button id="confirm-payment">CONFIRMER</button>
                
            </div>
            
        </div>
        


    </main>

    <div class="pop-up-profil">
        <a href="profil-client.html">Mon compte</a>
        <a href="ajouterMission.html">Poster une mission</a>
         <a href="mesmissions.html">Mes mission</a>
         <a href="demande-cote-client.html">Mes Demmande</a>
         <hr>
         <a href="connexion.html">se deconnecté</a>
     </div>
     <script src="../js/profil-pop-up.js"></script>
  
     <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const token = localStorage.getItem("authToken");
    if (!token) {
        window.location.href = "connexion.html";
        return;
    }
            const btnCarte = document.getElementById('btn-carte');
            const btnPoste = document.getElementById('btn-poste');
            const divCarte = document.getElementById('cartee');
            const divPoste = document.getElementById('postee');
        
            btnCarte.classList.add('active');
            divCarte.classList.add('active');
        
            btnCarte.addEventListener('click', function () {
                if (!this.classList.contains('active')) {
                    this.classList.add('active');
                    btnPoste.classList.remove('active');
                    divCarte.classList.add('active');
                    divPoste.classList.remove('active');
                }
            });
        
            btnPoste.addEventListener('click', function () {
                if (!this.classList.contains('active')) {
                    this.classList.add('active');
                    btnCarte.classList.remove('active');
                    divPoste.classList.add('active');
                    divCarte.classList.remove('active');
                }
            });
        
            const paymentData = JSON.parse(localStorage.getItem('paymentData'));
        
            if (!paymentData) {
                alert('Aucune donnée de paiement trouvée');
                window.location.href = 'demande-cote-client.html';
                return;
            }
        
            document.querySelector('.informations h2').textContent = paymentData.titre;
            document.querySelector('.total span:last-child').textContent = paymentData.prix + ' DA';
            document.querySelector('.informations h3').textContent = `Livraison dans ${paymentData.duree} jours`;
        
            localStorage.removeItem('paymentData');
        
            document.getElementById('confirm-payment').addEventListener('click', async function () {
                const typePaiement = btnCarte.classList.contains('active') ? 'CB' : 'CCP';
        
                let ccp = '';
                let cle = '';
                let numcb = '';
                let dateexperation = '';
                let vvs = '';
                let nomcarte = '';
                 
                 // Validation des champs selon le type de paiement
    if (typePaiement === 'CCP') {
        ccp = document.getElementById('ccp').value;
        cle = document.getElementById('cle').value;
        nomcarte = document.getElementById('nomposte').value;

        // Validation CCP (7 à 12 chiffres)
        if (!/^\d{7,12}$/.test(ccp)) {
            alert("Le CCP doit contenir entre 7 et 12 chiffres");
            return;
        }

        // Validation Clé (exactement 2 chiffres)
        if (!/^\d{2}$/.test(cle)) {
            alert("La clé CCP doit contenir exactement 2 chiffres");
            return;
        }

        // Validation Nom (lettres seulement)
        if (!/^[a-zA-ZÀ-ÿ\s\-']+$/.test(nomcarte)) {
            alert("Le nom ne doit contenir que des lettres");
            return;
        }
    } else {
        numcb = document.getElementById('numcarte').value;
        dateexperation = document.getElementById('date-ex').value;
        vvs = document.getElementById('vvs').value;
        nomcarte = document.getElementById('nomcarte').value;

        // Validation Numéro de carte (exactement 16 chiffres)
        if (!/^\d{16}$/.test(numcb)) {
            alert("Le numéro de carte doit contenir exactement 16 chiffres");
            return;
        }

        // Validation Date d'expiration (doit être dans le futur)
        const today = new Date();
        const expDate = new Date(dateexperation);
        if (expDate <= today) {
            alert("La date d'expiration doit être dans le futur");
            return;
        }

        // Validation VVS (exactement 3 chiffres)
        if (!/^\d{3}$/.test(vvs)) {
            alert("Le code VVS doit contenir exactement 3 chiffres");
            return;
        }

        // Validation Nom (lettres seulement)
        if (!/^[a-zA-ZÀ-ÿ\s\-']+$/.test(nomcarte)) {
            alert("Le nom ne doit contenir que des lettres");
            return;
        }
    }
                
        
                if (typePaiement === 'CCP') {
                    ccp = document.getElementById('ccp').value;
                    cle = document.getElementById('cle').value;
                    nomcarte = document.getElementById('nomposte').value;
                } else {
                    numcb = document.getElementById('numcarte').value;
                    dateexperation = document.getElementById('date-ex').value;
                    vvs = document.getElementById('vvs').value;
                    nomcarte = document.getElementById('nomcarte').value;
                }
        
                const paiementData = {
                    montant: paymentData.prix,
                    typePaiement,
                    idFreelancer: paymentData.idFreelancer,
                    idMission: paymentData.idMission,
                    ccp,
                    cle,
                    numcb,
                    dateexperation,
                    vvs,
                    nomcarte
                };
        
                try {
                    const response = await fetch('http://localhost:3001/transactions/paiement', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(paiementData),
                    });
        
                    const data = await response.json();
        
                    if (data.success) {
                        alert('Paiement confirmé et mission mise à jour!');
                        window.location.href = 'demande-cote-client.html';
                        // window.location.href = 'success.html';
                    } else {
                        alert('Erreur lors du paiement : ' + data.message);
                    }
                } catch (error) {
                    alert('Erreur de connexion : ' + error);
                }
            });
        });
        </script>
        
</body>
</html>

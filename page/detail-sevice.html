    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Vérification de l'authentification
            const token = localStorage.getItem("authToken");
            if (!token) {
                window.location.href = "connexion.html";
                return;
            }

            // Récupérer l'ID du service depuis l'URL
            const urlParams = new URLSearchParams(window.location.search);
            const serviceId = urlParams.get('id');

            if (!serviceId) {
                document.getElementById("container").innerHTML = `
                    <div class="error-message">
                        <p>Aucune service sélectionnée</p>
                        <a href="vitrine-freelancer.html">Retour aux missions</a>
                    </div>
                `;
                return;
            }

            // Charger les détails de la mission
            await loadMissionDetails(serviceId);
        });

        async function loadMissionDetails(serviceId) {
            try {
                const token = localStorage.getItem("authToken");
                const response = await fetch(`http://localhost:3001/services/${serviceId}`, {
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error("Erreur de chargement des détails du service");
                }

                const service = await response.json();
                displayMissionDetails(service);

            } catch (error) {
                console.error("Erreur:", error);
                document.getElementById("container").innerHTML = `
                    <div class="error-message">
                        <p>${error.message}</p>
                        <button onclick="loadMissionDetails(${serviceId})">Réessayer</button>
                    </div>
                `;
            }
        }

        function displayMissionDetails(service) {
            const container = document.getElementById("container");
            

            container.innerHTML = `
             
                <div>
                <div class="freelancer-info">
                    <img src="../images/user 1 (1).png" alt="Image">
                    <div>
                        <p>${service.freelancerPrenom} ${service.freelancerNom}</p>
                    </div>
                </div>
                
                <div class="free">
                    <h3>Description du service</h3>
                    <p>${service.description}</p>
                </div>
                </div>

                <div class="informations">
                    <h2>${service.titre}</h2>
                    <p>${service.categorie}</p>
                    <div class="information">
                        <img src="../images/Time Machine.png" alt="Image">
                        <p>${service.dureEstime} jours</p>
                        <img src="../images/Dollar Coin.png" alt="Image">
                        <p>${service.prix} DA</p>
                    </div>
                    <button id="apply-btn" >DEMANDER UNE MISSION</button>
                </div>
                </div>
                
            `;
            
            
        }

      
     </script>
</body>
